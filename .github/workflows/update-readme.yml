name: Update README statistics

on:
  push:
    paths-ignore:
      - "Readme.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Restore LeetCode metadata cache
        uses: actions/cache@v4
        with:
          path: .cache/leetcode-metadata.json
          key: leetcode-metadata-${{ runner.os }}-${{ hashFiles('scripts/update_readme.py') }}
          restore-keys: |
            leetcode-metadata-${{ runner.os }}-

      - name: Generate solution statistics
        run: python scripts/update_readme.py

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Readme.md
          if git diff --cached --quiet; then
            echo "README statistics are already up to date."
            exit 0
          fi
          git commit -m "docs: update solution statistics [skip ci]"
          git push
